[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── Compliance Engine Queue Worker ────────────────────────────────────────────
; Processes jobs from the 'jobs' table (DB_CONNECTION=mysql, QUEUE_CONNECTION=database)
[program:compliance-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work database \
    --sleep=3 \
    --tries=3 \
    --max-time=3600 \
    --timeout=120 \
    --queue=default,compliance,reports
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/compliance-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
user=www-data

; ── Compliance Batch Job Worker ───────────────────────────────────────────────
; Dedicated worker for heavy batch compliance report generation
[program:compliance-batch-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work database \
    --sleep=5 \
    --tries=2 \
    --max-time=7200 \
    --timeout=600 \
    --queue=batch,reports
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/compliance-batch-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=7200
user=www-data

; ── Laravel Scheduler ─────────────────────────────────────────────────────────
; Runs 'compliance:check-due' daily (defined in routes/console.php)
; Alternative to crontab — supervisor keeps it alive
[program:compliance-scheduler]
process_name=%(program_name)s
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/compliance-scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
user=www-data
